name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build TheDeep CleanerZ Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android 15 Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Application
        working-directory: frontend
        run: |
          npm run build
          mkdir -p dist/client
          cp public/index.html dist/client/index.html
          mkdir -p android/app/src/main/assets/public
          cp -r dist/client/* android/app/src/main/assets/public/

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log

      - name: Upload APK & Build Log Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TheDeepCleanerZ-App-Debug
          path: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend/android/gradle_build.log
          retention-days: 14
